<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B757-200F Cargo Loader Simulator</title>
    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script> <!-- Added Tween.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
</head>

<body>
    <div id="ui-container">
        <div class="panel" id="controls">
            <h2>Loader Control</h2>

            <div class="mode-switch">
                <button id="mode-pack-btn" class="mode-btn active">📦 Packing (Сборка)</button>
                <button id="mode-drive-btn" class="mode-btn">🚚 Driving (Погрузка)</button>
            </div>

            <div id="pack-controls">
                <div class="input-group">
                    <label>Pallet Type</label>
                    <select id="pallet-type">
                        <option value="pag">PAG (223x317 cm)</option>
                        <option value="pmc">PMC (243x317 cm)</option>
                    </select>
                </div>
                <h3>Add Cargo</h3>
                <div class="input-group">
                    <label>Shape / Model</label>
                    <select id="cargo-shape">
                        <optgroup label="Generic">
                            <option value="box">Box (Ящик)</option>
                            <option value="rounded">Rounded Box (Скругленный)</option>
                            <option value="cylinder_h">Cylinder Horiz (Рулон)</option>
                            <option value="cylinder_v">Cylinder Vert (Бочка)</option>
                        </optgroup>
                        <optgroup label="Real Cars">
                            <option value="cayenne">Porsche Cayenne (Typ 955)</option>
                            <option value="phantom">RR Phantom (LWB)</option>
                            <option value="ghost">RR Ghost</option>
                        </optgroup>
                    </select>
                </div>
                <div class="input-group">
                    <label>L x W x H (cm)</label>
                    <div style="display:flex; gap:5px;">
                        <input type="number" id="cargo-l" value="200" placeholder="L">
                        <input type="number" id="cargo-w" value="100" placeholder="W">
                        <input type="number" id="cargo-h" value="100" placeholder="H">
                    </div>
                </div>

                <div style="margin-top:10px; margin-bottom:10px;">
                    <button id="pack-gizmo-btn" class="secondary-btn" style="width:100%">Tool: Move
                        (Перемещение)</button>
                    <div style="display:flex; gap:5px; margin-top:5px;">
                        <button id="rot-left-btn" class="secondary-btn" style="flex:1;">↺ Left</button>
                        <button id="rot-right-btn" class="secondary-btn" style="flex:1;">Right ↻</button>
                    </div>
                </div>

                <button id="add-box-btn" class="primary-btn">Add Cargo +</button>
                <button id="clear-all-btn" class="danger-btn">Clear All</button>
            </div>

            <div id="drive-controls" style="display:none;">
                <h3>Pallet Navigation</h3>
                <p style="font-size:0.8em; color:#ccc;">Driving Mode: Move X/Z, Rotate Y.</p>
                <button id="reset-pos-btn" class="secondary-btn">Reset to Outside (На старт)</button>
                <button id="toggle-gizmo-btn" class="secondary-btn">Switch to Rotate</button>

                <hr style="border-color:#444; margin:10px 0;">
                <button id="auto-sim-btn" class="primary-btn" style="background:#0088AA;">Find Path & Load
                    (Авто-Вход)</button>
                <div id="sim-status" style="font-size:0.8em; margin-top:5px; color:#AAA;"></div>
            </div>

            <div class="separator"></div>

            <h3>Status</h3>
            <div id="status-display" class="status-safe">SAFE</div>
            <div id="door-status" class="status-safe" style="margin-top:5px; font-size:0.9em;">Clear</div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="js/app.js"></script>
</body>

</html>
